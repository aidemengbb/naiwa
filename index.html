<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0e">
<title>蛙之港湾</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0e; }
  body { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; color: #fff; touch-action: manipulation; user-select: none; -webkit-user-select: none; }

  #stage { position: fixed; inset: 0; }

  /* 背景 */
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.8s ease; }
  #bg.on { opacity: 1; }

  /* 立绘 */
  #sprite { position: absolute; left: 50%; bottom: 15vh; height: 62vh; transform: translateX(-50%); opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
  #sprite.on { opacity: 1; }

  /* 对话框（毛玻璃） */
  #dialog {
    position: absolute; left: 4%; right: 4%; bottom: 2.5vh;
    background: rgba(18, 22, 32, 0.5); border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 16px; padding: 14px 16px 16px; min-height: 21vh;
    backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%);
    box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    opacity: 0; transform: translateY(12px); transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: auto;
  }
  #dialog.on { opacity: 1; transform: translateY(0); }
  #name {
    display: inline-block; background: #f6c96b; color: #3a2a10; font-weight: 700;
    padding: 4px 14px; border-radius: 8px; font-size: 15px; margin-bottom: 8px;
  }
  #text { font-size: 17.5px; line-height: 1.75; letter-spacing: 0.4px; word-break: break-word; min-height: 4.2em; }
  #hint { position: absolute; right: 14px; bottom: 8px; font-size: 11px; color: rgba(255,255,255,0.35); }

  /* 金句全屏 */
  #quote {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; padding: 12%;
    background: rgba(6, 6, 12, 0.5); z-index: 5;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    font-size: clamp(22px, 5.5vw, 34px); line-height: 1.9; letter-spacing: 2px;
    text-align: center; color: #f8ecd2; white-space: pre-line;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  }
  #quote .q-mark { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 18px; letter-spacing: 4px; }

  /* 选项（毛玻璃） */
  #choices { position: absolute; left: 6%; right: 6%; bottom: 8vh; z-index: 6; display: none; }
  #choices button {
    display: block; width: 100%; margin: 10px 0; padding: 15px 18px;
    font-size: 17px; color: #fff; letter-spacing: 1px;
    background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 14px; text-align: left; cursor: pointer;
    backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%);
  }
  #choices button:active { background: rgba(246, 201, 107, 0.3); border-color: rgba(246, 201, 107, 0.6); }

  /* 标题画面 */
  #title {
    position: absolute; inset: 0; z-index: 10; display: none; flex-direction: column;
    align-items: center; justify-content: flex-start; text-align: center;
    background: rgba(6, 6, 12, 0.22);
    padding-top: 12vh;
  }
  #title .t1 { font-family: "KaiTi", "STKaiti", "楷体", serif; font-size: clamp(38px, 9.5vw, 60px); letter-spacing: 6px; color: #ffe9b8; text-shadow: 0 3px 18px rgba(0,0,0,0.95); }
  #title .t2 { margin-top: 12px; font-size: 15px; color: rgba(255,255,255,0.85); letter-spacing: 3px; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }

  /* 按钮组：开始/继续 居中，功能按钮横排一行 */
  #menuBtns {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 6vh;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: 88%; max-width: 340px;
  }
  #menuBtns .btn {
    width: 100%; padding: 14px 0; font-size: 17px; letter-spacing: 4px;
    background: rgba(246, 201, 107, 0.2); color: #fff; font-weight: 700;
    border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 30px; cursor: pointer;
    backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
    box-shadow: 0 4px 20px rgba(0,0,0,0.15); text-shadow: 0 1px 6px rgba(0,0,0,0.7);
  }
  #btnContinue { background: rgba(255, 255, 255, 0.09); }
  .menuRow { display: flex; gap: 10px; width: 100%; }
  .menuRow .btn { flex: 1; min-width: 0; padding: 12px 0; font-size: 14px; letter-spacing: 1px; background: rgba(255, 255, 255, 0.09); }
  #menuBtns .tip { margin-top: 8px; font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 1px; line-height: 1.7; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }

  /* 极限小屏（老手机/浏览器栏占高） */
  @media (max-height: 620px) {
    #title { padding-top: 6vh; }
    #title .t1 { font-size: 34px; }
    #menuBtns { bottom: 4vh; gap: 9px; }
    #menuBtns .btn { padding: 11px 0; font-size: 15px; }
    .menuRow .btn { padding: 10px 0; font-size: 13px; }
    #menuBtns .tip { display: none; }
  }


  /* 兼容模式（百度/荣耀内核）：最朴素界面，杜绝渲染错乱 */
  .compat #menuBtns .btn { background: rgba(246, 201, 107, 0.95); color: #3a2a10; text-shadow: none; border: 1px solid rgba(0,0,0,0.2); box-shadow: none; }
  .compat #menuBtns { gap: 14px; }
  .compat .menuRow .btn { background: rgba(40, 44, 58, 0.95); color: #fff; border: 1px solid rgba(255,255,255,0.25); }
  .compat #btnContinue, .compat #btnChapters, .compat #btnExtras { background: rgba(30, 34, 46, 0.95); color: #fff; }
  .compat .ic { display: none; }
  .compat #dialog { background: rgba(18, 22, 32, 0.95); }
  .compat #choices button { background: rgba(30, 34, 46, 0.95); }
  .compat #chapters, .compat #extras, #walls { background: rgba(8, 8, 14, 0.97); }
  .compat .cf-box { background: rgba(22, 24, 36, 0.98); }
  .compat #end { background: rgba(5, 5, 10, 0.95); }
  .compat #title { background: rgba(6, 6, 12, 0.55); }

  /* 不支持毛玻璃的浏览器：降级为实色，保证文字正常显示 */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    #dialog { background: rgba(18, 22, 32, 0.9); }
    #menuBtns .btn { background: rgba(246, 201, 107, 0.88); color: #3a2a10; text-shadow: none; }
    #btnContinue, #btnChapters, #btnExtras { background: rgba(20, 24, 36, 0.88); color: #fff; }
    #choices button { background: rgba(20, 22, 34, 0.92); }
    #chapters, #extras, #walls { background: rgba(8, 8, 14, 0.95); }
    #chapters .c-item, #extras .ex-item, #chapters .c-code input { background: rgba(255,255,255,0.12); }
    .cf-box { background: rgba(22, 24, 36, 0.97); }
    #end { background: rgba(5, 5, 10, 0.92); }
    #title { background: rgba(6, 6, 12, 0.5); }
  }

  /* 章节选择（毛玻璃整页） */
  #chapters {
    position: absolute; inset: 0; z-index: 12; display: none; flex-direction: column;
    background: rgba(8, 8, 14, 0.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    padding: 8vh 8% 4vh;
  }
  #chapters .c-title { font-size: 20px; letter-spacing: 4px; color: #ffe9b8; text-align: center; margin-bottom: 20px; }
  #chapters .c-list { flex: 1; overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
  #chapters .c-item {
    display: block; width: 100%; margin: 10px 0; padding: 16px 18px; text-align: left;
    font-size: 16px; letter-spacing: 1px; border-radius: 14px; cursor: pointer;
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #chapters .c-item.locked { color: rgba(255,255,255,0.45); cursor: default; }
  #chapters .c-item .st { float: right; font-size: 13px; }
  #chapters .c-item.locked .st { color: #f6c96b; }
  #chapters .c-code { display: flex; gap: 8px; margin-top: 12px; }
  #chapters .c-code input {
    flex: 1; padding: 12px; font-size: 16px; letter-spacing: 2px; text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.3); border-radius: 10px;
    background: rgba(255,255,255,0.12); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #fff;
  }
  #chapters .c-code button { padding: 12px 18px; font-size: 15px; border: none; border-radius: 10px; background: rgba(246, 201, 107, 0.85); color: #3a2a10; font-weight: 700; cursor: pointer; }
  #chapters .c-back { margin-top: 14px; padding: 12px; font-size: 15px; border: none; border-radius: 10px; background: rgba(255,255,255,0.12); color: #fff; cursor: pointer; }
  #chapters .c-msg { font-size: 13px; color: #f6c96b; margin-top: 8px; min-height: 18px; }

  /* 退出确认弹窗 */
  #confirmBox {
    position: absolute; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55);
  }
  #confirmBox.on { display: flex; }
  .cf-box {
    background: rgba(20, 24, 36, 0.7); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px; padding: 24px 26px; text-align: center; width: 78%;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .cf-text { font-size: 17px; line-height: 1.9; letter-spacing: 1px; }
  .cf-text span { font-size: 13px; color: rgba(255,255,255,0.6); }
  .cf-btns { display: flex; gap: 12px; margin-top: 20px; }
  .cf-btns button { flex: 1; padding: 13px; border: none; border-radius: 10px; font-size: 15.5px; cursor: pointer; letter-spacing: 2px; }
  #cfYes { background: #f6c96b; color: #3a2a10; font-weight: 700; }
  #cfNo { background: rgba(255,255,255,0.15); color: #fff; }

  /* 杂项（毛玻璃整页） */
  #extras, #walls {
    position: absolute; inset: 0; z-index: 12; display: none; flex-direction: column;
    background: rgba(8, 8, 14, 0.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    padding: 8vh 8% 4vh;
  }
  #extras .c-title, #walls .c-title { font-size: 20px; letter-spacing: 4px; color: #ffe9b8; text-align: center; margin-bottom: 20px; }
  #extras .c-list, #walls .c-list { flex: 1; overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
  #extras .ex-item, #walls .ex-item {
    display: flex; align-items: center; gap: 14px; width: 100%; margin: 10px 0;
    padding: 12px 16px; text-align: left; font-size: 16px; letter-spacing: 1px;
    border-radius: 14px; cursor: pointer; background: rgba(255,255,255,0.12);
    color: #fff; border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #extras .ex-item img, #walls .ex-item img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; flex: none; }
  #extras .c-back, #walls .c-back { margin-top: 14px; padding: 12px; font-size: 15px; border: none; border-radius: 10px; background: rgba(255,255,255,0.12); color: #fff; cursor: pointer; }

  /* 游戏内退出按钮 */
  #quitBtn {
    position: absolute; top: 18px; right: 12px; z-index: 7;
    top: max(18px, env(safe-area-inset-top, 0px));
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35);
    background: rgba(10, 10, 16, 0.55); color: #fff; font-size: 16px; cursor: pointer;
    display: none; align-items: center; justify-content: center;
  }

  /* 结局画面 */
  #end {
    position: absolute; inset: 0; z-index: 9; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(5, 5, 10, 0.7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: 10%;
  }
  #end .e1 { font-family: "KaiTi", "STKaiti", "楷体", serif; font-size: clamp(30px, 7vw, 46px); letter-spacing: 5px; color: #ffe9b8; }
  #end .e2 { margin-top: 18px; font-size: 15px; line-height: 2; color: rgba(255,255,255,0.8); white-space: pre-line; }
  #end .btn { margin-top: 30px; padding: 13px 44px; font-size: 16px; letter-spacing: 3px; background: rgba(246,201,107,0.92); color: #3a2a10; font-weight: 700; border: none; border-radius: 30px; cursor: pointer; }
</style>
</head>
<body>
<div id="stage">
  <img id="bg" alt="">
  <img id="sprite" alt="">
  <div id="quote"></div>
  <div id="dialog">
    <div id="name"></div>
    <div id="text"></div>
    <div id="hint">▼ 点击继续</div>
  </div>
  <div id="choices"></div>
  <div id="title">
    <div class="t1">蛙之港湾</div>
    <div class="t2">第一章 · 小卖部</div>
    <div id="menuBtns">
      <button class="btn" id="btnStart">开 始</button>
      <button class="btn" id="btnContinue" style="display:none">继续游戏</button>
      <div class="menuRow">
        <button class="btn" id="btnChapters"><span class="ic">📚</span>章节</button>
        <button class="btn" id="btnExtras"><span class="ic">🎲</span>杂项</button>
        <button class="btn" id="btnWalls"><span class="ic">🖼</span>壁纸</button>
      </div>
      <div class="tip">建议竖屏全屏游玩 · 请佩戴耳机<br>本故事纯属虚构，如有雷同，都是小时候的事</div>
    </div>
  </div>
  <div id="chapters">
    <div class="c-title">📚 章节</div>
    <div class="c-list" id="chapterList"></div>
    <div class="c-code">
      <input id="chapterCodeInput" placeholder="输入章节码解锁" autocomplete="off">
      <button id="chapterCodeBtn">解锁</button>
    </div>
    <div class="c-msg" id="chapterMsg"></div>
    <button class="c-back" id="chapterBack">← 返回主菜单</button>
  </div>
  <div id="extras">
    <div class="c-title">🎲 杂项</div>
    <div class="c-list" id="extraList"></div>
    <button class="c-back" id="extraBack">← 返回主菜单</button>
  </div>
  <div id="walls">
    <div class="c-title">🖼 壁纸</div>
    <div class="c-list" id="wallList"></div>
    <button class="c-back" id="wallBack">← 返回主菜单</button>
  </div>
  <button id="quitBtn" title="退出并保存">✕</button>
  <div id="confirmBox">
    <div class="cf-box">
      <div class="cf-text">确定退出吗？<br><span>进度会自动保存</span></div>
      <div class="cf-btns">
        <button id="cfYes">退出</button>
        <button id="cfNo">取消</button>
      </div>
    </div>
  </div>
  <div id="end"></div>
</div>
<script src="story.js"></script>

  function resolve(src) { return ASSET_MAP[src] || src; }

  /* ---------- 章节系统 ---------- */
  var chapterId = null;
  var curSceneId = null;
  var mode = "chapter";      // "chapter" 主线章节 | "extra" 杂项
  var extraId = null;
  var CHAPTER_KEYS = Object.keys(CHAPTERS);
  var EXTRA_KEYS = Object.keys(EXTRAS || {});
  var UNLOCK_KEY = "naigua_unlock_v1";
  function curChapter() { return CHAPTERS[chapterId] || CHAPTERS[CHAPTER_KEYS[0]]; }
  function curScenes() {
    if (mode === "extra") return (EXTRAS[extraId] || {}).scenes || {};
    return curChapter().scenes;
  }
  function curStart() {
    if (mode === "extra") return (EXTRAS[extraId] || {}).start || (Object.keys(curScenes())[0] || "");
    return curChapter().start;
  }
  function getUnlocks() { try { return JSON.parse(localStorage.getItem(UNLOCK_KEY) || "{}"); } catch (e) { return {}; } }
  function saveUnlocks(u) { try { localStorage.setItem(UNLOCK_KEY, JSON.stringify(u)); } catch (e) {} }
  function isUnlocked(id) {
    if (getUnlocks()[id]) return true;
    return id === CHAPTER_KEYS[0];   // 第一章永远默认解锁
  }
  function unlockChapter(id) { var u = getUnlocks(); u[id] = true; saveUnlocks(u); }
  function unlockNextChapter() {
    if (mode !== "chapter") return null;
    var idx = CHAPTER_KEYS.indexOf(chapterId);
    if (idx >= 0 && idx < CHAPTER_KEYS.length - 1) {
      var nxt = CHAPTER_KEYS[idx + 1];
      if (!isUnlocked(nxt)) { unlockChapter(nxt); return nxt; }
    }
    return null;
  }

  /* ---------- 壁纸系统 ---------- */
  var WALL_KEY = "naigua_walls_v1";
  var WALL_CHOICE_KEY = "naigua_wall_choice_v1";
  function getWalls() { try { return JSON.parse(localStorage.getItem(WALL_KEY) || "[]"); } catch (e) { return []; } }
  function saveWalls(w) { try { localStorage.setItem(WALL_KEY, JSON.stringify(w)); } catch (e) {} }
  function getWallChoice() { try { return localStorage.getItem(WALL_CHOICE_KEY) || "bg_title"; } catch (e) { return "bg_title"; } }
  function setWallChoice(bg) { try { localStorage.setItem(WALL_CHOICE_KEY, bg); } catch (e) {} }
  function unlockWallpaper(bg) {
    if (!bg) return;
    var w = getWalls();
    if (w.indexOf(bg) < 0) { w.push(bg); saveWalls(w); }
  }

  /* ---------- 预加载 ---------- */
  function preload(src) { if (!src || IMG_CACHE[src]) return; IMG_CACHE[src] = new Image(); IMG_CACHE[src].src = resolve(src); }
  function assetPath(name) { return (name.indexOf("/") >= 0 ? "assets/" + name : "assets/bg/" + name) + ".jpg"; }
  (function collect() {
    function collectScenes(scenes) {
      Object.keys(scenes).forEach(function (k) {
        scenes[k].forEach(function (n) {
          if (n.bg) preload(assetPath(n.bg));
          if (n.char) preload("assets/sprites/" + n.char + "_" + n.expr + ".png");
        });
      });
    }
    CHAPTER_KEYS.forEach(function (cid) { collectScenes(CHAPTERS[cid].scenes); });
    EXTRA_KEYS.forEach(function (eid) {
      var ex = EXTRAS[eid];
      if (ex.cover && ex.cover.indexOf("/") >= 0) preload(assetPath(ex.cover));
      collectScenes(ex.scenes || {});
    });
  })();

  /* ---------- 音乐（可选，放入 assets/audio/ 即自动播放） ---------- */
  var audio = new Audio("assets/audio/bgm_pond.mp3");
  audio.loop = true; audio.volume = 0.5; audio.preload = "none";
  audio.addEventListener("error", function () { /* 无音乐文件则静音 */ });
  function tryMusic() {
    audio.src = "assets/audio/bgm_pond.mp3";
    audio.play().catch(function () {});
  }

  /* ---------- 配音（可选，放入 assets/voice/ 即自动播放） ---------- */
  var voice = null;
  function playVoice(file) {
    if (!file) return;
    if (voice) { voice.pause(); voice.currentTime = 0; }
    var src = file.indexOf(".") >= 0 ? file : file + ".mp3";
    voice = new Audio(resolve("assets/voice/" + src));
    voice.play().catch(function () {});
  }

  /* ---------- 工具 ---------- */
  function save() {
    var loc = mode === "extra" ? "extra:" + extraId : chapterId;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ c: loc, s: curSceneId, i: curIdx, f: flags })); } catch (e) {}
  }
  function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { return null; } }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

  /* ---------- 渲染 ---------- */
  function setBg(name, blackFade) {
    if (!name) return;
    var src = assetPath(name);
    if (bg.getAttribute("data-src") === src) return;
    bg.setAttribute("data-src", src);
    var next = IMG_CACHE[src] || (IMG_CACHE[src] = new Image());
    if (blackFade) {
      // 黑化过渡：先黑屏，换图后淡入
      bg.style.transition = "opacity 0.25s";
      bg.style.opacity = "0";
      next.onload = function () {
        bg.src = resolve(src);
        requestAnimationFrame(function () {
          bg.style.transition = "opacity 0.8s";
          bg.style.opacity = "1";
        });
      };
      if (next.complete) {
        bg.src = resolve(src);
        requestAnimationFrame(function () {
          bg.style.transition = "opacity 0.8s";
          bg.style.opacity = "1";
        });
      } else { next.src = resolve(src); }
    } else {
      next.onload = function () { bg.src = resolve(src); bg.classList.add("on"); };
      if (next.complete) { bg.src = resolve(src); bg.classList.add("on"); }
      else { next.src = resolve(src); }
    }
  }
  function setSprite(char, expr) {
    if (!char) { sprite.classList.remove("on"); return; }
    sprite.src = resolve("assets/sprites/" + char + "_" + expr + ".png");
    sprite.classList.add("on");
  }
  function showDialog(node) {
    dialog.classList.add("on");
    if (node.name) { nameEl.style.display = "inline-block"; nameEl.textContent = node.name; }
    else { nameEl.style.display = "none"; }
  }
  function hideDialog() { dialog.classList.remove("on"); }

  function typeText(str, node, done) {
    clearInterval(typeTimer);
    var i = 0, speed = node.quote ? 90 : 34;
    typing = true; typeFull = false;
    typeTimer = setInterval(function () {
      i += 1;
      textEl.textContent = str.slice(0, i);
      if (i >= str.length) { clearInterval(typeTimer); typing = false; typeFull = true; if (done) done(); }
    }, speed);
  }

  /* ---------- 金句 ---------- */
  function showQuote(str, done) {
    quote.style.display = "flex";
    quote.innerHTML = "";
    var q = document.createElement("div");
    q.textContent = str;
    quote.appendChild(q);
    var m = document.createElement("div");
    m.className = "q-mark";
    m.textContent = "· 点击继续 ·";
    quote.appendChild(m);
    typing = true; typeFull = false;
    var i = 0;
    clearInterval(typeTimer);
    typeTimer = setInterval(function () {
      i += 1;
      q.textContent = str.slice(0, i);
      if (i >= str.length) { clearInterval(typeTimer); typing = false; typeFull = true; if (done) done(); }
    }, 80);
  }
  function hideQuote() { quote.style.display = "none"; }

  /* ---------- 选项 ---------- */
  function showChoices(list) {
    inChoice = true;
    choicesEl.innerHTML = "";
    choicesEl.style.display = "block";
    list.forEach(function (c) {
      var b = document.createElement("button");
      b.textContent = c.text;
      b.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (c.set) applySet(c.set);
        choicesEl.style.display = "none";
        inChoice = false;
        loadScene(c.goto);
      });
      choicesEl.appendChild(b);
    });
  }

  /* ---------- 主流程 ---------- */
  function loadScene(id) {
    var raw = curScenes()[id];
    if (!raw || !raw.length) { console.error("missing scene", id); return; }
    curSceneId = id;
    // 过滤条件不满足的节点（带 next/choice/end 的节点保留，保证流程可走）
    curScene = raw.filter(function (n) {
      if (!n.cond) return true;
      return evalCond(n.cond);
    });
    if (!curScene.length) curScene = raw;
    curIdx = 0;
    ended = false;
    hideQuote(); hideDialog(); choicesEl.style.display = "none"; setSprite(null);
    $("quitBtn").style.display = "flex";
    render();
  }

  function render() {
    var node = curScene[curIdx];
    if (!node) return;
    if (node.set) applySet(node.set);
    if (node.bg) setBg(node.bg, node.fade === "black");
    if (node.char) setSprite(node.char, node.expr); else setSprite(null);
    if (node.voice) playVoice(node.voice);
    if (node.choice && !node.text && !node.quote) {
      // 无对白的选项场景：直接显示选项
      hideQuote(); hideDialog();
      showChoices(node.choice);
      return;
    }
    if (node.quote) {
      dialog.classList.remove("on");
      showQuote(node.quote, function () {});
    } else {
      hideQuote();
      showDialog(node);
      typeText(node.text || "", node);
    }
    save();
  }

  function advance() {
    if (inChoice || ended) return;
    // 主菜单/章节/杂项/壁纸/结局界面显示时，点击不推进游戏
    if ($("title").style.display !== "none") return;
    if ($("chapters").style.display !== "none") return;
    if ($("extras").style.display !== "none") return;
    if ($("walls").style.display !== "none") return;
    if ($("end").style.display !== "none") return;
    var node = curScene[curIdx];
    if (!node) return;
    if (typing) { // 点击：直接显示完整
      clearInterval(typeTimer); typing = false; typeFull = true;
      if (node.quote) quote.firstChild.textContent = node.quote;
      else textEl.textContent = node.text;
      return;
    }
    curIdx += 1;
    var next = curScene[curIdx];
    if (!next) {
      // 场景末尾：选项或结局
      var last = curScene[curIdx - 1];
      if (last && last.choice) { showChoices(last.choice); save(); return; }
      if (last && last.end) { showEnd(last.end); return; }
      if (last && last.next) { loadScene(last.next); return; }
      // 默认回到标题
      backToTitle();
      return;
    }
    render();
  }

  function showEnd(kind) {
    ended = true;
    $("quitBtn").style.display = "none";
    var cfg = ENDINGS[kind] || { t: kind + " · 完", d: "" };
    var unlocked = unlockNextChapter();   // 仅章节模式会解锁下一章
    var wp = mode === "chapter" ? curChapter().wallpaper : null;
    if (wp) unlockWallpaper(wp);
    var e = $("end");
    e.style.display = "flex";
    e.innerHTML = "";
    var t = document.createElement("div");
    t.className = "e1";
    t.textContent = cfg.t;
    var d = document.createElement("div");
    d.className = "e2";
    d.textContent = cfg.d
      + (unlocked ? "\n\n🎉 “" + CHAPTERS[unlocked].title + "”已解锁！去章节里看看吧" : "")
      + (wp ? "\n\n🖼 新壁纸解锁了！去主菜单【壁纸】里换背景吧" : "")
      + "\n\n（重新开始，试试别的选择）";
    var b = document.createElement("button");
    b.className = "btn";
    b.textContent = "回到主菜单";
    b.addEventListener("click", function () { e.style.display = "none"; showTitle(); });
    e.appendChild(t); e.appendChild(d); e.appendChild(b);
    clearSave();
  }

  /* 结局文案 */
  var ENDINGS = {
    help:  { t: "帮忙 · 完", d: "帮朋友一把，比什么都甜。" },
    watch: { t: "看着 · 完", d: "糖会丢，路不会。明天，再走一遍。" },
    meet:  { t: "相遇 · 完", d: "有些约定，等得起一辈子。" },
    miss:  { t: "不相遇 · 完", d: "约定，有时候是用来等的，不是用来兑现的。" },
  };

  /* ---------- 标题 ---------- */
  function showTitle() {
    // 清空游戏进行状态，防止主界面点击误触发推进
    curScene = null; curIdx = 0; curSceneId = null;
    clearInterval(typeTimer); typing = false;
    setBg(getWallChoice());
    hideDialog(); hideQuote(); choicesEl.style.display = "none"; setSprite(null);
    $("title").style.display = "flex";
    $("chapters").style.display = "none";
    $("extras").style.display = "none";
    $("walls").style.display = "none";
    $("quitBtn").style.display = "none";
    $("end").style.display = "none";
    $("confirmBox").classList.remove("on");
    var ch = CHAPTERS[chapterId || CHAPTER_KEYS[0]];
    if (ch) $("title").querySelector(".t2").textContent = ch.title;
    var s = loadSave();
    $("btnContinue").style.display = s ? "block" : "none";
  }

  /* ---------- 壁纸管理 ---------- */
  function renderWalls() {
    var list = $("wallList");
    list.innerHTML = "";
    var walls = getWalls();
    var choice = getWallChoice();
    var items = [{ bg: "bg_title", label: "默认壁纸（初始）" }];
    CHAPTER_KEYS.forEach(function (cid) {
      var wp = CHAPTERS[cid].wallpaper;
      if (wp && walls.indexOf(wp) >= 0) items.push({ bg: wp, label: "章节奖励 · " + (CHAPTERS[cid].title || cid) });
    });
    items.forEach(function (it) {
      var b = document.createElement("button");
      b.className = "ex-item";
      var img = document.createElement("img");
      img.src = resolve(assetPath(it.bg));
      var t = document.createElement("span");
      t.textContent = it.label + (it.bg === choice ? "  ✓ 使用中" : "");
      b.appendChild(img); b.appendChild(t);
      b.addEventListener("click", function () {
        setWallChoice(it.bg);
        setBg(it.bg);
        renderWalls();
      });
      list.appendChild(b);
    });
  }
  $("btnWalls").addEventListener("click", function () {
    $("title").style.display = "none";
    renderWalls();
    $("walls").style.display = "flex";
  });
  $("wallBack").addEventListener("click", function () { $("walls").style.display = "none"; showTitle(); });

  /* ---------- 章节选择 ---------- */
  function renderChapters() {
    var list = $("chapterList");
    list.innerHTML = "";
    CHAPTER_KEYS.forEach(function (cid) {
      var ch = CHAPTERS[cid];
      var b = document.createElement("button");
      b.className = "c-item" + (isUnlocked(cid) ? "" : " locked");
      var st = document.createElement("span");
      st.className = "st";
      st.textContent = isUnlocked(cid) ? (cid === chapterId ? "▶ 当前" : "已解锁") : "🔒 未解锁";
      b.appendChild(document.createTextNode(ch.title));
      b.appendChild(st);
      b.addEventListener("click", function () {
        if (!isUnlocked(cid)) { $("chapterMsg").textContent = "🔒 这个章节还没解锁，输入章节码试试"; return; }
        $("chapters").style.display = "none";
        $("title").style.display = "none";
        tryMusic();
        mode = "chapter";
        chapterId = cid;
        flags = {};
        loadScene(ch.start);
      });
      list.appendChild(b);
    });
  }

  /* ---------- 杂项 ---------- */
  function renderExtras() {
    var list = $("extraList");
    list.innerHTML = "";
    if (!EXTRA_KEYS.length) {
      var empty = document.createElement("div");
      empty.style.cssText = "text-align:center;color:rgba(255,255,255,0.5);padding:40px 0;line-height:2";
      empty.textContent = "还没有杂项故事\n等作者添加吧";
      list.appendChild(empty);
      return;
    }
    EXTRA_KEYS.forEach(function (eid) {
      var ex = EXTRAS[eid];
      var b = document.createElement("button");
      b.className = "ex-item";
      var img = document.createElement("img");
      if (ex.cover && ex.cover.indexOf("/") >= 0) img.src = resolve(assetPath(ex.cover));
      else img.style.display = "none";
      var t = document.createElement("span");
      t.textContent = ex.title || "未命名故事";
      b.appendChild(img); b.appendChild(t);
      b.addEventListener("click", function () {
        $("extras").style.display = "none";
        $("title").style.display = "none";
        tryMusic();
        mode = "extra"; extraId = eid; flags = {};
        loadScene(curStart());
      });
      list.appendChild(b);
    });
  }

  $("btnStart").addEventListener("click", function () {
    $("title").style.display = "none";
    tryMusic();
    mode = "chapter";
    chapterId = CHAPTER_KEYS[0];
    flags = {};
    loadScene(curChapter().start);
  });
  $("btnContinue").addEventListener("click", function () {
    var s = loadSave();
    if (!s) return;
    var ok = false;
    if (s.c && s.c.indexOf("extra:") === 0) {
      var eid = s.c.slice(6);
      if (EXTRAS[eid] && EXTRAS[eid].scenes && EXTRAS[eid].scenes[s.s]) {
        mode = "extra"; extraId = eid; ok = true;
      }
    } else if (s.c && CHAPTERS[s.c] && CHAPTERS[s.c].scenes[s.s]) {
      mode = "chapter"; chapterId = s.c; ok = true;
    }
    if (ok) {
      $("title").style.display = "none";
      tryMusic();
      flags = s.f || {};
      loadScene(s.s);
      curIdx = Math.min(s.i, curScene.length - 1);
      ended = false; hideQuote();
      render();
    }
  });
  $("btnChapters").addEventListener("click", function () {
    $("title").style.display = "none";
    $("chapterMsg").textContent = "";
    $("chapterCodeInput").value = "";
    renderChapters();
    $("chapters").style.display = "flex";
  });
  $("btnExtras").addEventListener("click", function () {
    $("title").style.display = "none";
    renderExtras();
    $("extras").style.display = "flex";
  });
  $("extraBack").addEventListener("click", function () { $("extras").style.display = "none"; showTitle(); });
  $("chapterBack").addEventListener("click", function () { $("chapters").style.display = "none"; showTitle(); });
  $("chapterCodeBtn").addEventListener("click", function () {
    var code = $("chapterCodeInput").value.trim().toUpperCase();
    if (!code) { $("chapterMsg").textContent = "先输入章节码"; return; }
    var found = null;
    CHAPTER_KEYS.forEach(function (cid) {
      if (CHAPTERS[cid].code && CHAPTERS[cid].code.toUpperCase() === code) found = cid;
    });
    if (found) {
      if (isUnlocked(found)) { $("chapterMsg").textContent = "这个章节已经解锁了"; }
      else { unlockChapter(found); $("chapterMsg").textContent = "🎉 解锁成功：“" + CHAPTERS[found].title + "”"; renderChapters(); }
    } else {
      $("chapterMsg").textContent = "❌ 章节码不对，检查一下再试";
    }
  });

  /* ---------- 退出（确认后保存进度回主菜单） ---------- */
  $("quitBtn").addEventListener("click", function (ev) {
    ev.stopPropagation();
    if (ended) return;
    $("confirmBox").classList.add("on");
  });
  $("cfYes").addEventListener("click", function (ev) {
    ev.stopPropagation();
    $("confirmBox").classList.remove("on");
    save();
    hideQuote(); hideDialog(); choicesEl.style.display = "none"; setSprite(null);
    showTitle();
  });
  $("cfNo").addEventListener("click", function (ev) {
    ev.stopPropagation();
    $("confirmBox").classList.remove("on");
  });
  $("confirmBox").addEventListener("click", function (ev) { ev.stopPropagation(); });

  // 点击舞台推进（选项按钮已阻止冒泡）
  document.body.addEventListener("click", advance);

  // 调试：URL 带 #scene=xxx[&node=N] 直接进入指定场景/节点；#chapters 直达章节界面
  function parseHash() {
    var chm = location.hash.match(/ch=([a-z0-9_]+)/);
    if (chm && CHAPTERS[chm[1]]) chapterId = chm[1];
    if (location.hash.indexOf("chapters") >= 0) {
      $("title").style.display = "none";
      renderChapters();
      $("chapters").style.display = "flex";
      return;
    }
    if (location.hash.indexOf("extras") >= 0) {
      $("title").style.display = "none";
      renderExtras();
      $("extras").style.display = "flex";
      return;
    }
    if (location.hash.indexOf("walls") >= 0) {
      $("title").style.display = "none";
      renderWalls();
      $("walls").style.display = "flex";
      return;
    }
    var m = location.hash.match(/scene=([a-z0-9_]+)(?:&node=(\d+))?/);
    if (m) {
      chapterId = chapterId || CHAPTER_KEYS[0];
      if (curScenes()[m[1]]) {
        $("title").style.display = "none";
        curScene = curScenes()[m[1]];
        curIdx = m[2] ? Math.min(+m[2], curScene.length - 1) : 0;
        ended = false;
        $("quitBtn").style.display = "flex";
        // 先按顺序应用节点背景，保证跳转后背景正确
        var lastBg = null;
        for (var k = 0; k <= curIdx; k++) if (curScene[k].bg) lastBg = curScene[k].bg;
        if (lastBg) setBg(lastBg);
        var tgt = curScene[curIdx];
        if (tgt && tgt.choice) { hideQuote(); hideDialog(); showChoices(tgt.choice); save(); return; }
        render();
      }
    }
  }

  //   // 百度/荣耀/华为等国产内核：启用兼容模式
  if (/baiduboxapp|hihonor|MQQBrowser|Baidu|baidubrowser|hb_|Honor|HONOR|hw_|HuaweiBrowser|UCBrowser|Quark|MiuiBrowser/i.test(navigator.userAgent)) {
    document.documentElement.classList.add("compat");
  }

  showTitle();
  parseHash();
})();
</script>
</body>
</html>
